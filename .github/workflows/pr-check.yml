name: PR Check

# Runs on every pull request targeting main.
# All jobs must pass before merging.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared
        working-directory: packages/shared
        run: bun run build

      - name: Lint bot
        working-directory: apps/bot
        run: bun run lint

      - name: Lint leaderboard
        working-directory: apps/leaderboard
        run: bun run lint

      - name: Lint web
        working-directory: apps/web
        run: bun run lint

      - name: Lint consumer
        run: bun run lint:consumer

      - name: Reject undocumented global test mocks
        run: bun run check:test-mocks

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared
        working-directory: packages/shared
        run: bun run build

      - name: Typecheck bot
        working-directory: apps/bot
        run: bun run typecheck

      - name: Typecheck leaderboard
        working-directory: apps/leaderboard
        run: bun run typecheck:games

      - name: Typecheck monitor
        working-directory: apps/monitor
        run: bun run typecheck

      - name: Typecheck web
        working-directory: apps/web
        run: bun run typecheck

      - name: Typecheck consumer
        run: bunx tsc -p apps/consumer/tsconfig.json

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run all tests
        run: bun run test

      - name: Check test coverage threshold
        working-directory: apps/leaderboard
        run: |
          set -o pipefail
          # These tests use process-global module mocks and are already run in
          # isolation above; loading them with other files corrupts mock state.
          mapfile -t COVERAGE_FILES < <(node ../../scripts/coverage-files.mjs)
          bun test --coverage "${COVERAGE_FILES[@]}" 2>&1 | tee /tmp/coverage.txt
          COVERAGE=$(grep "All files" /tmp/coverage.txt | head -1 | awk -F'|' '{gsub(/[^0-9.]/, "", $3); print $3}')
          if [ -z "$COVERAGE" ]; then
            echo "::error::Could not parse coverage percentage from test output"
            exit 1
          fi
          if ! awk -v coverage="$COVERAGE" 'BEGIN { exit !(coverage >= 60) }'; then
            echo "::error::Test coverage ${COVERAGE}% is below 60% threshold"
            exit 1
          fi
          echo "OK: Test coverage ${COVERAGE}% meets 60% threshold"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared
        working-directory: packages/shared
        run: bun run build

      - name: Build leaderboard
        working-directory: apps/leaderboard
        run: node build.js

      - name: Build bot
        working-directory: apps/bot
        run: bun run typecheck

      - name: Build web
        working-directory: apps/web
        run: bun run build:worker

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies (moderate+)
        run: bun audit --audit-level moderate --ignore=GHSA-f88m-g3jw-g9cj --ignore=GHSA-mh99-v99m-4gvg
        # sharp <0.35.0 (transitive via wrangler, dev-only) and brace-expansion <=5.0.7
        # (transitive via eslint, dev-only) are tracked separately; both are build-time-only.

  migration-dry-run:
    name: Migration Dry-Run
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: yourrank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate migration filenames
        run: |
          echo "Checking migration file naming..."
          for f in supabase/migrations/*.sql; do
            basename=$(basename "$f")
            if ! echo "$basename" | grep -qE '^[0-9]{14}_.+\.sql$'; then
              echo "::error::Invalid migration filename: $basename (expected YYYYMMDDHHMMSS_description.sql)"
              exit 1
            fi
          done
          echo "OK: All migration filenames valid"

      - name: Run migrations against ephemeral Postgres
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: test
          PGDATABASE: yourrank_test
        run: |
          echo "Running all migrations against ephemeral Postgres..."
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "--- Applying: $(basename $f) ---"
            psql -v ON_ERROR_STOP=1 -f "$f" || {
              echo "::error::Migration failed: $(basename $f)"
              exit 1
            }
          done
          echo "OK: All migrations applied successfully"

      # The wagering money-safety tests (atomic debit, no negative balance under
      # concurrency, idempotency, authorization matrix) need a real Postgres, so
      # they run here against the freshly migrated database. They self-skip in
      # the plain `test` job where GAMES_TEST_DATABASE_URL is unset.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared
        working-directory: packages/shared
        run: bun run build

      - name: Games wagering tests (against migrated schema)
        env:
          GAMES_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/yourrank_test
        run: bun test packages/shared/src/__tests__/games-wagering.test.ts

      - name: Rollup tests (against migrated schema)
        env:
          ROLLUP_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/yourrank_test
        run: bun test apps/bot/src/__tests__/rollup-postgres.test.ts

      - name: Session and team tests (against migrated schema)
        env:
          SESSION_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/yourrank_test
        run: bun test packages/shared/src/__tests__/session-team-postgres.test.ts

      - name: Consumer jsonb writer tests (against migrated schema)
        env:
          JSONB_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/yourrank_test
        run: bun test apps/consumer/src/jsonb-database.test.js

      - name: Verify schema consistency
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: test
          PGDATABASE: yourrank_test
        run: |
          echo "Checking for common schema issues..."
          # Verify all tables have primary keys
          TABLES=$(psql -t -c "SELECT tablename FROM pg_tables WHERE schemaname = 'public';")
          for table in $TABLES; do
            table=$(echo "$table" | xargs)
            if [ -z "$table" ]; then continue; fi
            PK=$(psql -t -c "SELECT count(*) FROM pg_constraint WHERE conrelid = '$table'::regclass AND contype = 'p';")
            PK=$(echo "$PK" | xargs)
            if [ "$PK" = "0" ]; then
              echo "::warning::Table $table has no primary key"
            fi
          done
          echo "OK: Schema consistency checks passed"

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # An unconfigured environment is a broken release gate, not a pass: this
      # job used to report success having run zero tests. Configure the secrets
      # or accept a red check.
      - name: Require an E2E environment
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ALLOW_MUTATIONS: ${{ secrets.E2E_ALLOW_MUTATIONS }}
        run: |
          if [ -z "$E2E_BASE_URL" ] || [ "$E2E_ALLOW_MUTATIONS" != "1" ]; then
            echo "::error::E2E gate not configured: set the E2E_BASE_URL and E2E_ALLOW_MUTATIONS repository secrets to an isolated non-production environment. A skipped E2E run is not a passing E2E run. Scenarios needing a public board also require E2E_DB_URL (owner email verification is only completable by email); viewer wagering scenarios need E2E_VIEWER_SESSION and E2E_VIEWER_USERNAME."
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun test exits 0 when every test is filtered out or skipped, so the suite
      # runs through the gate: it prints a per-scenario PASSED / FAILED / SKIPPED /
      # NOT VERIFIABLE matrix and fails unless every required scenario executed
      # and passed.
      - name: Run E2E release gate
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ALLOW_MUTATIONS: ${{ secrets.E2E_ALLOW_MUTATIONS }}
          E2E_TELEGRAM_BOT_TOKEN: ${{ secrets.E2E_TELEGRAM_BOT_TOKEN }}
          E2E_VIEWER_SESSION: ${{ secrets.E2E_VIEWER_SESSION }}
          E2E_VIEWER_USERNAME: ${{ secrets.E2E_VIEWER_USERNAME }}
          E2E_DB_URL: ${{ secrets.E2E_DB_URL }}
        run: bun run gate
