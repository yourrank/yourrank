name: Deploy

# Push to main -> run pending DB migrations via Supabase CLI, then deploy both Workers.
# If the smoke test fails after a successful deploy, the rollback job automatically
# reverts both Workers to their previous Cloudflare deployment via `wrangler rollback`.
# Required GitHub repo secrets:
#   CLOUDFLARE_API_TOKEN   — Cloudflare API token
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id
#   SUPABASE_ACCESS_TOKEN  — Supabase personal access token (for CLI auth)
#   SUPABASE_DB_PASSWORD   — Database password (for supabase link --password)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    outputs:
      applied: ${{ steps.push-migrations.outputs.applied }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.39.2

      - name: Link project and push migrations
        id: push-migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -e
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD not set — cannot run migrations. Set it in repo secrets."
            exit 1
          fi
          if supabase link --project-ref lygcqzjxlqbvymkfjvel --password "$SUPABASE_DB_PASSWORD"; then
            if OUTPUT=$(supabase db push --include-all 2>&1); then
              printf '%s\n' "$OUTPUT"
            else
              STATUS=$?
              printf '%s\n' "$OUTPUT"
              exit "$STATUS"
            fi
            if printf '%s\n' "$OUTPUT" | grep -Eiq 'no changes|up to date'; then
              echo "applied=false" >> "$GITHUB_OUTPUT"
            else
              echo "applied=true" >> "$GITHUB_OUTPUT"
            fi
            echo "Migrations applied successfully"
          else
            echo "::error::supabase link failed — check SUPABASE_DB_PASSWORD and project ref"
            exit 1
          fi

  deploy-leaderboard:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    outputs:
      lb-version: ${{ steps.capture-lb.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Build shared
        working-directory: packages/shared
        run: bun run build
      - name: Audit dependencies
        run: bun audit --audit-level moderate --ignore=GHSA-f88m-g3jw-g9cj --ignore=GHSA-mh99-v99m-4gvg
        # sharp <0.35.0 (transitive via wrangler, dev-only) and brace-expansion <=5.0.7
        # (transitive via eslint, dev-only) are tracked separately; both are build-time-only.
      - name: Run tests
        run: bun run test
      - name: Syntax-check client assets
        working-directory: apps/leaderboard
        run: |
          # build.js inlines assets as STRINGS, so a browser-side syntax error
          # (e.g. a stray brace) ships to prod tagged "deployed/success" — that
          # is exactly how PR #234 broke the dashboard. Parse every client JS
          # file with Bun.Transpiler (parse-only, never executes top-level code,
          # so browser globals like `document` don't false-positive) and fail
          # the deploy on any syntax error.
          bun -e '
            const t = new Bun.Transpiler({ loader: "js" });
            const fs = require("fs");
            const { execSync } = require("child_process");
            let fail = 0;
            const files = execSync("find src/assets -type f -name \"*.js\"")
              .toString().trim().split("\n").filter(Boolean);
            for (const f of files) {
              try { t.transformSync(fs.readFileSync(f, "utf8")); }
              catch (e) { console.log(`::error::Syntax error in ${f}\n` + e.message.split("\n").slice(0,4).join("\n")); fail++; }
            }
            if (fail > 0) { console.log(`::error::${fail} client asset(s) failed syntax check — deploy aborted.`); process.exit(1); }
            console.log(`OK: all ${files.length} client assets parse cleanly`);
          '
      - name: Check test coverage threshold
        working-directory: apps/leaderboard
        run: |
          set -o pipefail
          # These tests use process-global module mocks and are already run in
          # isolation above; loading them with other files corrupts mock state.
          mapfile -t COVERAGE_FILES < <(node ../../scripts/coverage-files.mjs)
          bun test --coverage "${COVERAGE_FILES[@]}" 2>&1 | tee /tmp/coverage.txt
          COVERAGE=$(grep "All files" /tmp/coverage.txt | head -1 | awk -F'|' '{gsub(/[^0-9.]/, "", $3); print $3}')
          if [ -z "$COVERAGE" ]; then
            echo "::error::Could not parse coverage percentage from test output"
            exit 1
          fi
          if ! awk -v coverage="$COVERAGE" 'BEGIN { exit !(coverage >= 60) }'; then
            echo "::error::Test coverage ${COVERAGE}% is below 60% threshold"
            exit 1
          fi
          echo "OK: Test coverage ${COVERAGE}% meets 60% threshold"
      - name: Build leaderboard
        working-directory: apps/leaderboard
        run: node build.js
      - name: Capture current leaderboard version
        id: capture-lb
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CURRENT=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/services/yourrank-site/environments/production" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            | jq -r '.result.default_environment.script.hash // "none"')
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current leaderboard version: $CURRENT"

      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/leaderboard
          command: deploy
          wranglerVersion: "4.106.0"

  deploy-bot:
    needs: [migrate, deploy-leaderboard]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      bot-version: ${{ steps.capture-bot.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Build shared
        working-directory: packages/shared
        run: bun run build
      - name: Audit dependencies
        run: bun audit --audit-level moderate --ignore=GHSA-f88m-g3jw-g9cj --ignore=GHSA-mh99-v99m-4gvg
        # sharp <0.35.0 (transitive via wrangler, dev-only) and brace-expansion <=5.0.7
        # (transitive via eslint, dev-only) are tracked separately; both are build-time-only.
      - name: Run bot tests
        run: bun run test
      - name: Typecheck bot
        working-directory: apps/bot
        run: bun run typecheck
      - name: Capture current bot version
        id: capture-bot
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CURRENT=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/services/yourrank-bot/environments/production" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            | jq -r '.result.default_environment.script.hash // "none"')
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current bot version: $CURRENT"

      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/bot
          command: deploy
          wranglerVersion: "4.106.0"

  deploy-consumer:
    name: Deploy queue consumer
    needs: [migrate, deploy-bot]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit --audit-level moderate --ignore=GHSA-f88m-g3jw-g9cj --ignore=GHSA-mh99-v99m-4gvg
        # sharp <0.35.0 (transitive via wrangler, dev-only) and brace-expansion <=5.0.7
        # (transitive via eslint, dev-only) are tracked separately; both are build-time-only.
      - name: Build shared
        working-directory: packages/shared
        run: bun run build
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/consumer
          command: deploy
          wranglerVersion: "4.106.0"

  smoke-test:
    needs: [deploy-leaderboard, deploy-bot, deploy-consumer]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare propagation
        run: |
          MAX_RETRIES=6
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 10 https://yourrank.site/ || true)
            if [ "$STATUS" = "200" ]; then
              echo "OK: yourrank.site is live (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/$MAX_RETRIES: HTTP $STATUS — retrying in 10s…"
            sleep 10
          done
          echo "FAIL: yourrank.site not reachable after $MAX_RETRIES attempts"
          exit 1

      - name: "Smoke: leaderboard (yourrank.site)"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 https://yourrank.site/)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: leaderboard returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "OK: leaderboard HTTP $STATUS"

      - name: "Smoke: pricing page"
        # /pricing is served by the web Worker via the marketing proxy; the web
        # Worker deploys in a parallel workflow, so retry while it catches up.
        run: |
          MAX_RETRIES=12
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 https://yourrank.site/pricing || true)
            if [ "$STATUS" = "200" ]; then
              echo "OK: pricing HTTP $STATUS (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/$MAX_RETRIES: HTTP $STATUS — retrying in 15s…"
            sleep 15
          done
          echo "FAIL: pricing not returning 200 after $MAX_RETRIES attempts"
          exit 1

      - name: "Smoke: contact page"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 https://yourrank.site/contact)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: contact returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "OK: contact HTTP $STATUS"

      - name: "Smoke: bot worker + database"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://yourrank.site/r/smoke-probe-ci)
          if [ "$STATUS" = "404" ]; then
            echo "OK: bot worker + DB healthy (HTTP 404 — slug not found, as expected)"
          elif [ "$STATUS" = "500" ]; then
            echo "FAIL: bot DB appears to be down (HTTP 500)"
            exit 1
          else
            echo "FAIL: unexpected HTTP $STATUS from bot worker"
            exit 1
          fi

      - name: "Smoke: Telegram dashboard"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://yourrank.site/dashboard/telegram)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Telegram dashboard returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "OK: Telegram dashboard HTTP $STATUS"

      - name: "Smoke: legacy bot dashboard redirect"
        run: |
          read -r STATUS LOCATION <<<"$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" --max-time 20 https://yourrank.site/bot/dashboard)"
          case "$STATUS:$LOCATION" in
            30[12]:*/dashboard/telegram)
              echo "OK: /bot/dashboard redirects to $LOCATION (HTTP $STATUS)"
              ;;
            *)
              echo "FAIL: /bot/dashboard returned HTTP $STATUS to '$LOCATION' (expected a redirect to /dashboard/telegram)"
              exit 1
              ;;
          esac

      - name: "Smoke: consumer health ping"
        run: |
          MAX_RETRIES=6
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://yourrank.site/consumer/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "OK: consumer /health returned HTTP 200 (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/$MAX_RETRIES: consumer /health HTTP $STATUS — retrying in 10s…"
            sleep 10
          done
          echo "FAIL: consumer /health did not return 200 after $MAX_RETRIES attempts"
          exit 1

      - name: "Smoke: DB connectivity (yourrank.site/health)"
        run: |
          # This smoke test asks whether the deploy broke the site. A degraded consumer or DLQ backlog is an operational alert, not grounds for reverting a Worker that serves fine.
          RESPONSE=$(curl -sS -L --max-time 20 -w '\n%{http_code}' https://yourrank.site/health || true)
          STATUS=$(printf '%s\n' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "503" ]; then
            echo "FAIL: /health returned HTTP $STATUS (expected 200 or 503) — response: $BODY"
            exit 1
          fi
          if ! printf '%s' "$BODY" | jq empty >/dev/null 2>&1; then
            echo "FAIL: /health returned unparseable JSON — response: $BODY"
            exit 1
          fi
          if ! printf '%s' "$BODY" | jq -e '.db == true' >/dev/null 2>&1; then
            echo "FAIL: /health reported db != true — response: $BODY"
            exit 1
          fi
          if ! printf '%s' "$BODY" | jq -e '.email_verification.required == true and .email_verification.configured == true' >/dev/null 2>&1; then
            echo "FAIL: /health reported creator verification email delivery is not configured — response: $BODY"
            exit 1
          fi
          HEALTH_STATUS=$(printf '%s' "$BODY" | jq -r '.status // empty')
          if [ "$HEALTH_STATUS" != "ok" ]; then
            echo "::warning::/health is not fully healthy; downstream signals may be degraded: $BODY"
          else
            echo "OK: /health returned HTTP $STATUS with db=true and status=ok"
          fi

      - name: Summarise failure
        if: failure()
        run: |
          echo "==========================================="
          echo "SMOKE TEST FAILED — deploy may be broken."
          echo "Commit: ${{ github.sha }}"
          echo "Rollback job will attempt automatic recovery."
          echo "==========================================="

  deploy-monitor:
    name: Deploy uptime monitor
    needs: [smoke-test]
    runs-on: ubuntu-latest
    environment: production
    if: success()
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run monitor tests
        working-directory: apps/monitor
        run: bun run test

      - name: Typecheck monitor
        working-directory: apps/monitor
        run: bun run typecheck

      - name: Deploy monitor Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/monitor
          command: deploy
          wranglerVersion: "4.106.0"

  # -----------------------------------------------------------------
  # Auto-rollback: triggered ONLY when smoke-test fails.
  # Uses `wrangler rollback` to revert each Worker to its previous
  # Cloudflare deployment — no manual intervention needed.
  # -----------------------------------------------------------------
  rollback:
    needs: [migrate, deploy-leaderboard, deploy-bot, deploy-consumer, smoke-test]
    if: always() && needs.migrate.result == 'success' && needs.smoke-test.result == 'failure'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'

      - name: Warn if schema is ahead of rolled-back code
        if: needs.migrate.outputs.applied == 'true'
        run: |
          echo "::warning::Migrations were applied before rollback; the database schema is ahead of the rolled-back code and needs manual review."
          {
            echo "## Rollback schema warning"
            echo ""
            echo "Migrations were applied before rollback. The database schema is now ahead of the rolled-back code and needs manual review."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rollback leaderboard worker
        if: ${{ always() && needs.deploy-leaderboard.result == 'success' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/leaderboard
          command: rollback
          wranglerVersion: "4.106.0"

      - name: Rollback bot worker
        if: ${{ always() && needs.deploy-bot.result == 'success' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/bot
          command: rollback
          wranglerVersion: "4.106.0"

      - name: Rollback consumer worker
        if: ${{ always() && needs.deploy-consumer.result == 'success' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/consumer
          command: rollback
          wranglerVersion: "4.106.0"

      - name: Verify rollback health
        run: |
          echo "Waiting 15s for Cloudflare propagation…"
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 https://yourrank.site/ || true)
          if [ "$STATUS" = "200" ]; then
            echo "OK: yourrank.site healthy after rollback (HTTP $STATUS)"
          else
            echo "WARNING: yourrank.site returned HTTP $STATUS after rollback"
            echo "Manual intervention may be required."
          fi

      - name: Rollback summary
        if: always()
        run: |
          echo "==========================================="
          echo "AUTO-ROLLBACK EXECUTED"
          echo "Smoke test failed on commit: ${{ github.sha }}"
          echo "Leaderboard, bot, and consumer Workers reverted to previous deployments."
          echo "Pre-deploy leaderboard version: ${{ needs.deploy-leaderboard.outputs.lb-version || 'unknown' }}"
          echo "Pre-deploy bot version:         ${{ needs.deploy-bot.outputs.bot-version || 'unknown' }}"
          echo "Verify: https://yourrank.site"
          echo "==========================================="
