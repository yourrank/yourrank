name: Deploy

# The single production release orchestrator. Push to main -> preflight, capture the
# exact production state of every Worker (including Web), prove N-1 compatibility,
# run expand-only DB migrations, deploy Leaderboard -> Bot -> Consumer, verify
# backend-local readiness, deploy Monitor, deploy Web from the SAME commit SHA,
# verify web-local readiness, run the cross-service release smoke, then record the
# promoted release SHA. Every Worker version is tagged with the commit SHA so the
# finalizer can prove provenance. A bounded finalizer re-reads actual production
# state after every failure/cancellation and restores only changed Workers (Web
# included) to their exact captured version allocations; migrations are retained.
# There is no independent production Web deployment path.
# Required GitHub repo secrets:
#   CLOUDFLARE_API_TOKEN   — Cloudflare API token
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id
#   SUPABASE_ACCESS_TOKEN  — Supabase personal access token (for CLI auth)
#   SUPABASE_DB_PASSWORD   — Database password (for supabase link --password)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Shared production mutation lock: Deploy and Rollback use the same group so a Web
# or backend release can never overlap another release or a manual rollback.
concurrency:
  group: production-mutation
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Validate production release capacity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Cloudflare Cron Trigger inventory and capacity
        env:
          CLOUDFLARE_WORKERS_PLAN: ${{ vars.CLOUDFLARE_WORKERS_PLAN }}
        run: node scripts/check-production-cron-capacity.mjs
      - name: Validate migration compatibility window
        run: node scripts/check-migration-compatibility.mjs

  capture-release-state:
    name: Capture exact pre-mutation production state
    needs: release-preflight
    runs-on: ubuntu-latest
    environment: production
    outputs:
      state: ${{ steps.capture.outputs.state }}
    steps:
      - uses: actions/checkout@v7
      - name: Capture Worker versions and applied migrations
        id: capture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: lygcqzjxlqbvymkfjvel
        run: node scripts/release-recovery-state.mjs capture
      - name: Verify migration baseline is recorded in production
        env:
          RELEASE_STATE: ${{ steps.capture.outputs.state }}
        run: node scripts/check-migration-compatibility.mjs baseline-applied

  # F-004: prove the exact production N-1 Worker sources against every schema
  # migration in this release before the production database is mutated.
  n1-compatibility:
    name: Semantic N-1 Compatibility
    needs: release-preflight
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: yourrank_n1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - name: Install current dependencies
        run: bun install --frozen-lockfile
      - name: Read production N-1 source refs
        id: n1-baseline
        run: node -e "const fs=require('fs'),m=require('./release/n1-production-baseline.json');fs.appendFileSync(process.env.GITHUB_OUTPUT,'coherent='+m.coherentRollbackSourceSha+'\nleaderboard='+m.workers.leaderboard.liveSourceSha+'\n')"
      - name: Check out coherent rollback source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.n1-baseline.outputs.coherent }}
          path: .n1/coherent
          persist-credentials: false
      - name: Check out live Leaderboard source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.n1-baseline.outputs.leaderboard }}
          path: .n1/leaderboard
          persist-credentials: false
      - name: Build exact N-1 source dependencies
        run: |
          bun install --cwd .n1/coherent --frozen-lockfile --ignore-scripts
          bun run --cwd .n1/coherent/packages/shared build
          bun install --cwd .n1/leaderboard --frozen-lockfile --ignore-scripts
          bun run --cwd .n1/leaderboard/packages/shared build
          bun run --cwd packages/shared build
      - name: Verify N-1 Workers against the expanded schema
        env:
          N1_DATABASE_URL: postgres://postgres:test@localhost:5432/yourrank_n1_test
        run: bun run verify:n1-compatibility
      # F-039/F-044: certify the backend DB identity model on the expanded schema
      # (new LOGIN role, RLS policies for yourrank_app, public-role isolation,
      # old identity kept for rollback) before any database is mutated.
      - name: Database identity and RLS certification (F-039/F-044)
        env:
          DB_IDENTITY_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/yourrank_n1_test
        run: node scripts/verify-db-identity.mjs certify

  migrate:
    needs: [capture-release-state, n1-compatibility]
    runs-on: ubuntu-latest
    outputs:
      applied: ${{ steps.push-migrations.outputs.applied }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.39.2

      - name: Link project and push migrations
        id: push-migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -e
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD not set — cannot run migrations. Set it in repo secrets."
            exit 1
          fi
          if supabase link --project-ref lygcqzjxlqbvymkfjvel --password "$SUPABASE_DB_PASSWORD"; then
            if OUTPUT=$(supabase db push --include-all 2>&1); then
              printf '%s\n' "$OUTPUT"
            else
              STATUS=$?
              printf '%s\n' "$OUTPUT"
              exit "$STATUS"
            fi
            if printf '%s\n' "$OUTPUT" | grep -Eiq 'no changes|up to date'; then
              echo "applied=false" >> "$GITHUB_OUTPUT"
            else
              echo "applied=true" >> "$GITHUB_OUTPUT"
            fi
            echo "Migrations applied successfully"
          else
            echo "::error::supabase link failed — check SUPABASE_DB_PASSWORD and project ref"
            exit 1
          fi

  deploy-leaderboard:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Build shared
        working-directory: packages/shared
        run: bun run build
      - name: Audit dependencies
        run: bun audit --audit-level moderate --ignore=GHSA-f88m-g3jw-g9cj --ignore=GHSA-mh99-v99m-4gvg
        # sharp <0.35.0 (transitive via wrangler, dev-only) and brace-expansion <=5.0.7
        # (transitive via eslint, dev-only) are tracked separately; both are build-time-only.
      - name: Run tests
        run: bun run test
      - name: Syntax-check client assets
        working-directory: apps/leaderboard
        run: |
          # build.js inlines assets as STRINGS, so a browser-side syntax error
          # (e.g. a stray brace) ships to prod tagged "deployed/success" — that
          # is exactly how PR #234 broke the dashboard. Parse every client JS
          # file with Bun.Transpiler (parse-only, never executes top-level code,
          # so browser globals like `document` don't false-positive) and fail
          # the deploy on any syntax error.
          bun -e '
            const t = new Bun.Transpiler({ loader: "js" });
            const fs = require("fs");
            const { execSync } = require("child_process");
            let fail = 0;
            const files = execSync("find src/assets -type f -name \"*.js\"")
              .toString().trim().split("\n").filter(Boolean);
            for (const f of files) {
              try { t.transformSync(fs.readFileSync(f, "utf8")); }
              catch (e) { console.log(`::error::Syntax error in ${f}\n` + e.message.split("\n").slice(0,4).join("\n")); fail++; }
            }
            if (fail > 0) { console.log(`::error::${fail} client asset(s) failed syntax check — deploy aborted.`); process.exit(1); }
            console.log(`OK: all ${files.length} client assets parse cleanly`);
          '
      - name: Check test coverage threshold
        working-directory: apps/leaderboard
        run: |
          set -o pipefail
          # These tests use process-global module mocks and are already run in
          # isolation above; loading them with other files corrupts mock state.
          mapfile -t COVERAGE_FILES < <(node ../../scripts/coverage-files.mjs)
          bun test --coverage "${COVERAGE_FILES[@]}" 2>&1 | tee /tmp/coverage.txt
          COVERAGE=$(grep "All files" /tmp/coverage.txt | head -1 | awk -F'|' '{gsub(/[^0-9.]/, "", $3); print $3}')
          if [ -z "$COVERAGE" ]; then
            echo "::error::Could not parse coverage percentage from test output"
            exit 1
          fi
          if ! awk -v coverage="$COVERAGE" 'BEGIN { exit !(coverage >= 60) }'; then
            echo "::error::Test coverage ${COVERAGE}% is below 60% threshold"
            exit 1
          fi
          echo "OK: Test coverage ${COVERAGE}% meets 60% threshold"
      - name: Build leaderboard
        working-directory: apps/leaderboard
        run: node build.js
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/leaderboard
          command: deploy --tag ${{ github.sha }} --message release-${{ github.sha }}-run-${{ github.run_id }}
          wranglerVersion: "4.106.0"

  deploy-bot:
    needs: [migrate, deploy-leaderboard]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Build shared
        working-directory: packages/shared
        run: bun run build
      - name: Audit dependencies
        run: bun audit --audit-level moderate --ignore=GHSA-f88m-g3jw-g9cj --ignore=GHSA-mh99-v99m-4gvg
        # sharp <0.35.0 (transitive via wrangler, dev-only) and brace-expansion <=5.0.7
        # (transitive via eslint, dev-only) are tracked separately; both are build-time-only.
      - name: Run bot tests
        run: bun run test
      - name: Typecheck bot
        working-directory: apps/bot
        run: bun run typecheck
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/bot
          command: deploy --tag ${{ github.sha }} --message release-${{ github.sha }}-run-${{ github.run_id }}
          wranglerVersion: "4.106.0"

  deploy-consumer:
    name: Deploy queue consumer
    needs: [migrate, deploy-bot]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit --audit-level moderate --ignore=GHSA-f88m-g3jw-g9cj --ignore=GHSA-mh99-v99m-4gvg
        # sharp <0.35.0 (transitive via wrangler, dev-only) and brace-expansion <=5.0.7
        # (transitive via eslint, dev-only) are tracked separately; both are build-time-only.
      - name: Build shared
        working-directory: packages/shared
        run: bun run build
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/consumer
          command: deploy --tag ${{ github.sha }} --message release-${{ github.sha }}-run-${{ github.run_id }}
          wranglerVersion: "4.106.0"

  # Backend-local readiness only. Nothing here depends on the Web Worker, so a
  # healthy backend is never judged by a Web page that has not been promoted yet.
  backend-readiness:
    name: Backend-local readiness
    needs: [deploy-leaderboard, deploy-bot, deploy-consumer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - name: Install dependencies (db identity gate)
        run: bun install --frozen-lockfile
      - name: "Backend: leaderboard health endpoint reachable"
        run: |
          MAX_RETRIES=6
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 10 https://yourrank.site/health || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
              echo "OK: leaderboard /health answers HTTP $STATUS (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/$MAX_RETRIES: HTTP $STATUS — retrying in 10s…"
            sleep 10
          done
          echo "FAIL: leaderboard /health not reachable after $MAX_RETRIES attempts"
          exit 1

      - name: "Backend: contact page (leaderboard-served)"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 https://yourrank.site/contact)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: contact returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "OK: contact HTTP $STATUS"

      - name: "Backend: bot worker + database"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://yourrank.site/r/smoke-probe-ci)
          if [ "$STATUS" = "404" ]; then
            echo "OK: bot worker + DB healthy (HTTP 404 — slug not found, as expected)"
          elif [ "$STATUS" = "500" ]; then
            echo "FAIL: bot DB appears to be down (HTTP 500)"
            exit 1
          else
            echo "FAIL: unexpected HTTP $STATUS from bot worker"
            exit 1
          fi

      - name: "Backend: Telegram dashboard"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://yourrank.site/dashboard/telegram)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Telegram dashboard returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "OK: Telegram dashboard HTTP $STATUS"

      - name: "Backend: legacy bot dashboard redirect"
        run: |
          read -r STATUS LOCATION <<<"$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" --max-time 20 https://yourrank.site/bot/dashboard)"
          case "$STATUS:$LOCATION" in
            30[12]:*/dashboard/telegram)
              echo "OK: /bot/dashboard redirects to $LOCATION (HTTP $STATUS)"
              ;;
            *)
              echo "FAIL: /bot/dashboard returned HTTP $STATUS to '$LOCATION' (expected a redirect to /dashboard/telegram)"
              exit 1
              ;;
          esac

      - name: "Backend: consumer health ping"
        run: |
          MAX_RETRIES=6
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://yourrank.site/consumer/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "OK: consumer /health returned HTTP 200 (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/$MAX_RETRIES: consumer /health HTTP $STATUS — retrying in 10s…"
            sleep 10
          done
          echo "FAIL: consumer /health did not return 200 after $MAX_RETRIES attempts"
          exit 1

      - name: "Backend: DB connectivity (yourrank.site/health)"
        run: |
          # This check asks whether the deploy broke the backend. A degraded consumer or DLQ backlog is an operational alert, not grounds for reverting a Worker that serves fine.
          RESPONSE=$(curl -sS -L --max-time 20 -w '\n%{http_code}' https://yourrank.site/health || true)
          STATUS=$(printf '%s\n' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "503" ]; then
            echo "FAIL: /health returned HTTP $STATUS (expected 200 or 503) — response: $BODY"
            exit 1
          fi
          if ! printf '%s' "$BODY" | jq empty >/dev/null 2>&1; then
            echo "FAIL: /health returned unparseable JSON — response: $BODY"
            exit 1
          fi
          if ! printf '%s' "$BODY" | jq -e '.db == true' >/dev/null 2>&1; then
            echo "FAIL: /health reported db != true — response: $BODY"
            exit 1
          fi
          if ! printf '%s' "$BODY" | jq -e '.email_verification.required == true and .email_verification.configured == true' >/dev/null 2>&1; then
            echo "FAIL: /health reported creator verification email delivery is not configured — response: $BODY"
            exit 1
          fi
          HEALTH_STATUS=$(printf '%s' "$BODY" | jq -r '.status // empty')
          if [ "$HEALTH_STATUS" != "ok" ]; then
            echo "::warning::/health is not fully healthy; downstream signals may be degraded: $BODY"
          else
            echo "OK: /health returned HTTP $STATUS with db=true and status=ok"
          fi
      - name: "Backend: DB identity through the production Hyperdrive (F-039/F-044, release/db-identity.json)"
        run: |
          HEALTH_BODY=$(curl -sS -L --max-time 20 https://yourrank.site/health || true)
          export HEALTH_BODY
          node scripts/verify-db-identity.mjs health production

      - name: Summarise failure
        if: failure()
        run: |
          echo "==========================================="
          echo "BACKEND READINESS FAILED — Web will not be promoted."
          echo "Commit: ${{ github.sha }}"
          echo "Release finalizer will inspect actual production state and recover changed Workers."
          echo "==========================================="

  deploy-monitor:
    name: Deploy uptime monitor
    needs: [backend-readiness]
    runs-on: ubuntu-latest
    environment: production
    if: success()
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run monitor tests
        working-directory: apps/monitor
        run: bun run test

      - name: Typecheck monitor
        working-directory: apps/monitor
        run: bun run typecheck

      - name: Deploy monitor Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/monitor
          command: deploy --tag ${{ github.sha }} --message release-${{ github.sha }}-run-${{ github.run_id }}
          wranglerVersion: "4.106.0"

  # Web is promoted only after the backend from the same commit is live and ready.
  deploy-web:
    name: Deploy Next.js web Worker
    needs: [backend-readiness, deploy-monitor]
    runs-on: ubuntu-latest
    environment: production
    if: success()
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Build shared
        working-directory: packages/shared
        run: bun run build
      - name: Lint web
        working-directory: apps/web
        run: bun run lint
      - name: Typecheck web
        working-directory: apps/web
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build web worker
        working-directory: apps/web
        run: bun run build:worker
      - name: Deploy web worker tagged with the release SHA
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:ci -- --tag "${{ github.sha }}" --message release-${{ github.sha }}-run-${{ github.run_id }}

  # Web-local readiness: hit the Web Worker directly on its own hostname. The
  # marketing header bypasses the apex redirect so no Leaderboard proxy is involved.
  web-readiness:
    name: Web-local readiness
    needs: [deploy-web]
    runs-on: ubuntu-latest
    steps:
      - name: "Web: marketing Worker serves its homepage and pricing directly"
        run: |
          MAX_RETRIES=12
          for i in $(seq 1 $MAX_RETRIES); do
            HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -H 'x-yr-marketing: 1' https://app.yourrank.site/ || true)
            PRICING_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -H 'x-yr-marketing: 1' https://app.yourrank.site/pricing || true)
            if [ "$HOME_STATUS" = "200" ] && [ "$PRICING_STATUS" = "200" ]; then
              echo "OK: web Worker home=$HOME_STATUS pricing=$PRICING_STATUS (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/$MAX_RETRIES: home=$HOME_STATUS pricing=$PRICING_STATUS — retrying in 10s…"
            sleep 10
          done
          echo "FAIL: web Worker not serving marketing pages after $MAX_RETRIES attempts"
          exit 1

      - name: "Web: legacy host redirects unmarked requests to the apex"
        run: |
          read -r STATUS LOCATION <<<"$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" --max-time 20 https://app.yourrank.site/pricing)"
          case "$STATUS:$LOCATION" in
            301:https://yourrank.site/pricing*)
              echo "OK: app.yourrank.site/pricing redirects to $LOCATION"
              ;;
            *)
              echo "FAIL: app.yourrank.site/pricing returned HTTP $STATUS to '$LOCATION' (expected 301 to https://yourrank.site/pricing)"
              exit 1
              ;;
          esac

  # Final integration gate: the cross-service user journey through the apex,
  # which proxies marketing routes from Leaderboard to Web via service binding.
  release-smoke:
    name: Cross-service release smoke
    needs: [backend-readiness, web-readiness]
    runs-on: ubuntu-latest
    steps:
      - name: "Integration: apex homepage proxied from Leaderboard to Web"
        run: |
          MAX_RETRIES=6
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 https://yourrank.site/ || true)
            if [ "$STATUS" = "200" ]; then
              echo "OK: yourrank.site/ HTTP $STATUS (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/$MAX_RETRIES: HTTP $STATUS — retrying in 10s…"
            sleep 10
          done
          echo "FAIL: apex homepage not returning 200 after $MAX_RETRIES attempts"
          exit 1

      - name: "Integration: apex pricing proxied from Leaderboard to Web"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 https://yourrank.site/pricing)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: pricing returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "OK: pricing HTTP $STATUS"

      - name: "Integration: apex homepage links into the dashboard journey"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 https://yourrank.site/dashboard/telegram)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: dashboard entry returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "OK: dashboard entry HTTP $STATUS"

      - name: Summarise failure
        if: failure()
        run: |
          echo "==========================================="
          echo "CROSS-SERVICE RELEASE SMOKE FAILED — release will not be promoted."
          echo "Commit: ${{ github.sha }}"
          echo "Release finalizer will inspect actual production state and recover changed Workers, including Web."
          echo "==========================================="

  release-finalizer:
    name: Finalize release or recover exact production state
    needs:
      - capture-release-state
      - migrate
      - deploy-leaderboard
      - deploy-bot
      - deploy-consumer
      - backend-readiness
      - deploy-monitor
      - deploy-web
      - web-readiness
      - release-smoke
    if: ${{ always() && needs.capture-release-state.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: lygcqzjxlqbvymkfjvel
      BASELINE_RELEASE_STATE: ${{ needs.capture-release-state.outputs.state }}
      RELEASE_STAGE_RESULTS: >-
        {"migrate":"${{ needs.migrate.result }}","deploy-leaderboard":"${{ needs.deploy-leaderboard.result }}","deploy-bot":"${{ needs.deploy-bot.result }}","deploy-consumer":"${{ needs.deploy-consumer.result }}","backend-readiness":"${{ needs.backend-readiness.result }}","deploy-monitor":"${{ needs.deploy-monitor.result }}","deploy-web":"${{ needs.deploy-web.result }}","web-readiness":"${{ needs.web-readiness.result }}","release-smoke":"${{ needs.release-smoke.result }}"}
      RELEASE_MANIFEST_PATH: ${{ github.workspace }}/release-manifest.json
    steps:
      - uses: actions/checkout@v7

      - name: Observe production and build deterministic recovery plan
        id: plan
        run: node scripts/release-recovery-state.mjs plan

      # The production promotion decision: the release SHA is promoted only when
      # every stage succeeded AND every Worker's active allocation is tagged with it.
      - name: Promote release SHA and record provenance manifest
        id: promote
        if: ${{ steps.plan.outputs.release_failed == 'false' }}
        run: node scripts/release-recovery-state.mjs promote

      - name: Upload release provenance manifest
        if: ${{ always() && steps.promote.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: ${{ github.workspace }}/release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Record successful release finalization
        if: ${{ steps.plan.outputs.release_failed == 'false' && steps.promote.outcome == 'success' }}
        run: |
          echo "## Production release finalized" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend, Web, readiness, and cross-service smoke stages completed for $GITHUB_SHA; promoted release SHA recorded." >> "$GITHUB_STEP_SUMMARY"

      - name: Record failed release with no observed production mutation
        if: ${{ steps.plan.outputs.release_failed == 'true' && steps.plan.outputs.mutation_observed == 'false' }}
        run: |
          echo "No production migration or Worker version change was observed; no rollback command will run."
          echo "## Recovery not required" >> "$GITHUB_STEP_SUMMARY"
          echo "The release failed, but production still matches the captured pre-mutation state." >> "$GITHUB_STEP_SUMMARY"

      - name: Revalidate retained migration compatibility
        if: ${{ always() && steps.plan.outputs.release_failed == 'true' && steps.plan.outputs.migrations_changed == 'true' }}
        run: node scripts/check-migration-compatibility.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: ${{ always() && steps.plan.outputs.release_failed == 'true' && steps.plan.outputs.worker_changes == 'true' }}
        with:
          bun-version: '1.3.0'

      - name: Install pinned recovery dependencies
        if: ${{ always() && steps.plan.outputs.release_failed == 'true' && steps.plan.outputs.worker_changes == 'true' }}
        run: bun install --frozen-lockfile

      - name: Restore exact Leaderboard version allocation
        if: ${{ always() && steps.plan.outputs.release_failed == 'true' && steps.plan.outputs.leaderboard_changed == 'true' }}
        working-directory: apps/leaderboard
        env:
          VERSION_SPECS: ${{ steps.plan.outputs.leaderboard_restore_specs }}
        run: |
          read -ra SPECS <<< "$VERSION_SPECS"
          bunx wrangler versions deploy "${SPECS[@]}" -y --message "Automatic recovery for GitHub run ${GITHUB_RUN_ID}"

      - name: Restore exact Bot version allocation
        if: ${{ always() && steps.plan.outputs.release_failed == 'true' && steps.plan.outputs.bot_changed == 'true' }}
        working-directory: apps/bot
        env:
          VERSION_SPECS: ${{ steps.plan.outputs.bot_restore_specs }}
        run: |
          read -ra SPECS <<< "$VERSION_SPECS"
          bunx wrangler versions deploy "${SPECS[@]}" -y --message "Automatic recovery for GitHub run ${GITHUB_RUN_ID}"

      - name: Restore exact Consumer version allocation
        if: ${{ always() && steps.plan.outputs.release_failed == 'true' && steps.plan.outputs.consumer_changed == 'true' }}
        working-directory: apps/consumer
        env:
          VERSION_SPECS: ${{ steps.plan.outputs.consumer_restore_specs }}
        run: |
          read -ra SPECS <<< "$VERSION_SPECS"
          bunx wrangler versions deploy "${SPECS[@]}" -y --message "Automatic recovery for GitHub run ${GITHUB_RUN_ID}"

      - name: Restore exact Monitor version allocation
        if: ${{ always() && steps.plan.outputs.release_failed == 'true' && steps.plan.outputs.monitor_changed == 'true' }}
        working-directory: apps/monitor
        env:
          VERSION_SPECS: ${{ steps.plan.outputs.monitor_restore_specs }}
        run: |
          read -ra SPECS <<< "$VERSION_SPECS"
          bunx wrangler versions deploy "${SPECS[@]}" -y --message "Automatic recovery for GitHub run ${GITHUB_RUN_ID}"

      - name: Restore exact Web version allocation
        if: ${{ always() && steps.plan.outputs.release_failed == 'true' && steps.plan.outputs.web_changed == 'true' }}
        working-directory: apps/web
        env:
          VERSION_SPECS: ${{ steps.plan.outputs.web_restore_specs }}
        run: |
          read -ra SPECS <<< "$VERSION_SPECS"
          bunx wrangler versions deploy "${SPECS[@]}" -y --message "Automatic recovery for GitHub run ${GITHUB_RUN_ID}"

      - name: Verify exact Worker state and retained migration history
        if: ${{ always() && steps.plan.outputs.release_failed == 'true' && steps.plan.outputs.mutation_observed == 'true' }}
        run: node scripts/release-recovery-state.mjs verify

      - name: Verify recovered backend health with bounded retries
        if: ${{ always() && steps.plan.outputs.release_failed == 'true' && steps.plan.outputs.runtime_health_required == 'true' }}
        run: |
          for attempt in $(seq 1 6); do
            HEALTH_RESPONSE=$(curl -sS -L --max-time 20 -w '\n%{http_code}' https://yourrank.site/health || true)
            HEALTH_STATUS=$(printf '%s\n' "$HEALTH_RESPONSE" | tail -n1)
            HEALTH_BODY=$(printf '%s\n' "$HEALTH_RESPONSE" | sed '$d')
            BOT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://yourrank.site/r/smoke-probe-ci || true)
            CONSUMER_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://yourrank.site/consumer/health || true)
            if { [ "$HEALTH_STATUS" = "200" ] || [ "$HEALTH_STATUS" = "503" ]; } \
              && printf '%s' "$HEALTH_BODY" | jq -e '.db == true' >/dev/null 2>&1 \
              && [ "$BOT_STATUS" = "404" ] \
              && [ "$CONSUMER_STATUS" = "200" ]; then
              echo "Recovered backend is coherent (health=$HEALTH_STATUS, bot=$BOT_STATUS, consumer=$CONSUMER_STATUS)."
              exit 0
            fi
            echo "Recovery health attempt $attempt/6 failed (health=$HEALTH_STATUS, bot=$BOT_STATUS, consumer=$CONSUMER_STATUS)."
            [ "$attempt" = "6" ] || sleep 10
          done
          echo "::error::Recovered Worker versions did not return to a coherent healthy state after bounded retries."
          exit 1

      - name: Verify recovered Web health with bounded retries
        if: ${{ always() && steps.plan.outputs.release_failed == 'true' && steps.plan.outputs.web_health_required == 'true' }}
        run: |
          for attempt in $(seq 1 6); do
            WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -H 'x-yr-marketing: 1' https://app.yourrank.site/ || true)
            APEX_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 https://yourrank.site/ || true)
            if [ "$WEB_STATUS" = "200" ] && [ "$APEX_STATUS" = "200" ]; then
              echo "Recovered Web is serving (web=$WEB_STATUS, apex=$APEX_STATUS)."
              exit 0
            fi
            echo "Web recovery health attempt $attempt/6 failed (web=$WEB_STATUS, apex=$APEX_STATUS)."
            [ "$attempt" = "6" ] || sleep 10
          done
          echo "::error::Recovered Web version did not return to a healthy state after bounded retries."
          exit 1

      - name: Emit recovery incident summary
        if: ${{ always() && (steps.plan.outcome != 'success' || steps.plan.outputs.release_failed == 'true') }}
        run: |
          {
            echo "## Production release incident"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- Migration job: ${{ needs.migrate.result }}"
            echo "- Leaderboard deploy: ${{ needs.deploy-leaderboard.result }}"
            echo "- Bot deploy: ${{ needs.deploy-bot.result }}"
            echo "- Consumer deploy: ${{ needs.deploy-consumer.result }}"
            echo "- Backend readiness: ${{ needs.backend-readiness.result }}"
            echo "- Monitor deploy: ${{ needs.deploy-monitor.result }}"
            echo "- Web deploy: ${{ needs.deploy-web.result }}"
            echo "- Web readiness: ${{ needs.web-readiness.result }}"
            echo "- Cross-service smoke: ${{ needs.release-smoke.result }}"
            echo "- Promoted release SHA: ${{ steps.promote.outputs.promoted_release_sha || 'none' }}"
            echo "- Migrations added and retained: ${{ steps.plan.outputs.migrations_added || 'state query failed' }}"
            echo "- Worker recovery targets: ${{ steps.plan.outputs.worker_changes == 'true' && 'see recovery plan above' || 'none observed' }}"
            echo "- Recovery job status: ${{ job.status }}"
            echo ""
            echo "Database migrations were not rolled back. Review failed recovery steps immediately."
          } >> "$GITHUB_STEP_SUMMARY"
