name: Deploy Staging

# Manual trigger only — staging deploys are on-demand, not automatic.
# Trigger from the GitHub Actions tab with "Run workflow".

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Refuse incomplete or production-shared staging infrastructure
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
          STAGING_MAIL_FROM: ${{ secrets.STAGING_MAIL_FROM }}
        run: |
          set -e
          if grep -Rqs 'STAGING_HYPERDRIVE_ID_PLACEHOLDER' apps/leaderboard/wrangler.toml apps/bot/wrangler.toml apps/consumer/wrangler.toml apps/web/wrangler.toml; then
            echo "::error::Staging Hyperdrive IDs are not configured; refusing a partial deploy."
            exit 1
          fi
          for name in STAGING_SUPABASE_PROJECT_REF STAGING_SUPABASE_ACCESS_TOKEN STAGING_SUPABASE_DB_PASSWORD STAGING_RESEND_API_KEY STAGING_MAIL_FROM; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for a staging deployment."
              exit 1
            fi
          done

  migrate-staging:
    needs: preflight
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.39.2
      - name: Apply staging migrations before Worker code
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          set -e
          supabase link --project-ref "$STAGING_SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --include-all

  deploy-leaderboard-staging:
    needs: [migrate-staging, deploy-web-staging, deploy-consumer-staging]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit --audit-level moderate --ignore=GHSA-f88m-g3jw-g9cj --ignore=GHSA-mh99-v99m-4gvg
        # sharp <0.35.0 (transitive via wrangler, dev-only) and brace-expansion <=5.0.7
        # (transitive via eslint, dev-only) are tracked separately; both are build-time-only.
      - name: Run leaderboard tests
        run: bun run test
      - name: Build leaderboard
        working-directory: apps/leaderboard
        run: node build.js
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        env:
          RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.STAGING_MAIL_FROM }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/leaderboard
          command: deploy --env staging
          wranglerVersion: "4.106.0"
          secrets: |
            RESEND_API_KEY
            MAIL_FROM

  deploy-web-staging:
    needs: migrate-staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Build, test, and deploy the staging marketing Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun run lint
          bun run test
          bun run build:worker
          bun run deploy:ci -- --env staging

  deploy-consumer-staging:
    needs: migrate-staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Test consumer
        working-directory: apps/consumer
        run: bun test
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/consumer
          command: deploy --env staging
          wranglerVersion: "4.106.0"

  deploy-bot-staging:
    needs: [migrate-staging, deploy-leaderboard-staging]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit --audit-level moderate --ignore=GHSA-f88m-g3jw-g9cj --ignore=GHSA-mh99-v99m-4gvg
        # sharp <0.35.0 (transitive via wrangler, dev-only) and brace-expansion <=5.0.7
        # (transitive via eslint, dev-only) are tracked separately; both are build-time-only.
      - name: Run bot tests
        run: bun run test
      - name: Typecheck bot
        working-directory: apps/bot
        run: bun run typecheck
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/bot
          command: deploy --env staging
          wranglerVersion: "4.106.0"

  smoke-test-staging:
    needs: [deploy-leaderboard-staging, deploy-bot-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare propagation
        run: sleep 15

      - name: "Smoke: staging health"
        run: |
          RESPONSE=$(curl -sS -L --max-time 20 -w '\n%{http_code}' https://staging.yourrank.site/health || true)
          STATUS=$(printf '%s\n' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')
          if [ "$STATUS" = "200" ] && printf '%s' "$BODY" | jq -e '.db == true and .email_verification.configured == true' >/dev/null 2>&1; then
            echo "OK: staging health and creator email delivery are ready"
          else
            echo "::error::Staging health failed (HTTP $STATUS): $BODY"
            exit 1
          fi

      - name: "Smoke: staging Telegram dashboard"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://staging.yourrank.site/dashboard/telegram || true)
          if [ "$STATUS" = "200" ]; then
            echo "OK: staging Telegram dashboard HTTP $STATUS"
          else
            echo "WARNING: staging Telegram dashboard returned HTTP $STATUS"
            exit 1
          fi

  deploy-monitor-staging:
    needs: smoke-test-staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Test and typecheck monitor
        working-directory: apps/monitor
        run: |
          bun test
          bun run typecheck
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/monitor
          command: deploy --env staging
          wranglerVersion: "4.106.0"

      - name: Staging deploy summary
        if: always()
        run: |
          echo "==========================================="
          echo "STAGING DEPLOY COMPLETE"
          echo "Commit: ${{ github.sha }}"
          echo "==========================================="
