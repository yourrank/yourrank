name: Deploy web (staging only)

# Staging-only deployment of the Next.js web Worker (yourrank-web-staging).
#
# Production Web is promoted exclusively by .github/workflows/deploy.yml as part of
# the coherent release (same commit SHA as Leaderboard/Bot/Consumer/Monitor, one
# promotion decision, F-003 recovery). This workflow has no push trigger and no
# production target, so it can never promote apps/web, packages/shared, bun.lock,
# or any other change to production independently of the backend release.

on:
  workflow_dispatch: {}

permissions:
  contents: read

# Shares the staging lock with .github/workflows/staging.yml so an ad-hoc Web push
# can never interleave with a staging release/recovery.
concurrency:
  group: staging-mutation
  cancel-in-progress: false

jobs:
  deploy-web-staging:
    name: Deploy Next.js web app to staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared
        working-directory: packages/shared
        run: bun run build

      - name: Lint
        working-directory: apps/web
        run: bun run lint

      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Render staging Hyperdrive id (fails closed on placeholder/production ids)
        env:
          STAGING_HYPERDRIVE_ID: ${{ vars.STAGING_HYPERDRIVE_ID }}
        run: node scripts/staging-preflight.mjs render

      - name: Build web worker
        working-directory: apps/web
        run: bun run build:worker

      - name: Deploy web worker to staging
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:ci -- --env staging --tag "${{ github.sha }}" --message staging-${{ github.sha }}-run-${{ github.run_id }}
