name: Deploy web

# Deploys the Next.js web Worker (marketing pages served at the apex) on push to
# main when its sources change, and on demand via workflow_dispatch.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "bun.lock"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Deploy Next.js web app
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared
        working-directory: packages/shared
        run: bun run build

      - name: Lint
        working-directory: apps/web
        run: bun run lint

      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build web worker
        working-directory: apps/web
        run: bun run build:worker

      - name: Deploy web worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.event.inputs.environment || 'production' }}" = "staging" ]; then
            bun run deploy:ci -- --env staging
          else
            bun run deploy:ci
          fi
