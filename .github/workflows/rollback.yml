name: Rollback

# Manually deploy a pinned version of a worker for rollback.
# Trigger from GitHub Actions tab → "Run workflow" → select worker + git ref.
# Shares the `production-mutation` concurrency lock with Deploy so a manual rollback
# never overlaps a coherent release (backend or Web).

on:
  workflow_dispatch:
    inputs:
      worker:
        description: "Worker to rollback"
        required: true
        type: choice
        options:
          - bot
          - consumer
          - leaderboard
          - monitor
          - web
      version:
        description: "Git ref to deploy (commit SHA, tag, or branch)"
        required: true
        type: string
      skip_migrations:
        description: "Intentionally skip pushing migrations before rollback"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-mutation
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.version }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'

      - run: bun install --frozen-lockfile

      - name: Build leaderboard assets
        if: inputs.worker == 'leaderboard'
        working-directory: apps/leaderboard
        run: node build.js

      - name: Build web worker
        if: inputs.worker == 'web'
        working-directory: apps/web
        run: bun run build:worker

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.39.2

      # supabase db push from an older ref applies nothing, so rolling code back
      # never undoes schema changes.
      - name: Push migrations before rollback
        if: inputs.skip_migrations == false
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -e
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD not set — cannot run migrations. Set it in repo secrets or explicitly enable skip_migrations."
            exit 1
          fi
          if supabase link --project-ref lygcqzjxlqbvymkfjvel --password "$SUPABASE_DB_PASSWORD"; then
            supabase db push --include-all
            echo "Migrations applied for rollback ref ${{ inputs.version }}"
          else
            echo "::error::supabase link failed during rollback — refusing to deploy without migration verification"
            exit 1
          fi

      - name: Record intentional migration skip
        if: inputs.skip_migrations == true
        run: echo "::warning::Migration push intentionally skipped by the operator."

      - name: Rollback deploy
        working-directory: apps/${{ inputs.worker }}
        run: |
          echo "==========================================="
          echo "ROLLBACK: deploying ${{ inputs.worker }} at ref ${{ inputs.version }}"
          echo "==========================================="
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [ "${{ inputs.worker }}" = "web" ]; then
            bun run deploy:ci -- --tag "$SOURCE_SHA" --message rollback-${SOURCE_SHA}-run-${GITHUB_RUN_ID}
          else
            npx wrangler@4.106.0 deploy --tag "$SOURCE_SHA" --message rollback-${SOURCE_SHA}-run-${GITHUB_RUN_ID}
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check
        run: |
          sleep 15
          if [ "${{ inputs.worker }}" = "leaderboard" ]; then
            URL="https://yourrank.site/"
          elif [ "${{ inputs.worker }}" = "bot" ]; then
            URL="https://yourrank.site/dashboard/telegram"
          elif [ "${{ inputs.worker }}" = "web" ]; then
            URL="https://yourrank.site/pricing"
          else
            echo "No public HTTP route for ${{ inputs.worker }}; deploy success is the rollback check."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 "$URL")
          if [ "$STATUS" = "200" ]; then
            echo "OK: rollback smoke check passed (HTTP $STATUS)"
          else
            echo "FAIL: rollback smoke check returned HTTP $STATUS"
            exit 1
          fi

      - name: Summarise
        if: always()
        run: |
          echo "==========================================="
          echo "ROLLBACK RESULT"
          echo "Worker: ${{ inputs.worker }}"
          echo "Ref:    ${{ inputs.version }}"
          echo "Status: ${{ job.status }}"
          echo "==========================================="
