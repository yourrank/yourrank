# F-015: manual restore drill — restore the newest production backup into an
# isolated scratch database, verify integrity and application read paths,
# measure real RTO/RPO, retire the scratch copy, and publish a secret-free
# evidence document.
#
# This workflow NEVER writes to production and NEVER records a backup
# verification itself. A successful evidence artifact is recorded afterwards by
# an admin through POST /api/admin/backup-verifications (fresh step-up 2FA,
# audit-logged) — see docs/backup-restore-plan.md "Restore drill".
#
# Credentials live in the GitHub `recovery-drill` environment and are
# administrative restore credentials, deliberately separate from the Worker
# database identity (yourrank_worker) and from production release secrets:
#   RESTORE_TARGET_DATABASE_URL   scratch Supabase project / database (never production)
#   RESTORE_SOURCE_DATABASE_URL   read credential for logical-dump drills
#   RESTORE_BACKUP_DOWNLOAD_URL   short-lived provider backup download link (provider-backup drills)
#   SUPABASE_ACCESS_TOKEN         Management API token (read backup metadata)
# Variables: RESTORE_TARGET_ID (scratch project ref / label).
name: Restore Drill

on:
  workflow_dispatch:
    inputs:
      backup_source:
        description: >-
          provider-backup: restore the newest Supabase automated backup (download link supplied as secret).
          logical-dump: take a fresh pg_dump of production with the read credential and restore it.
        type: choice
        required: true
        default: provider-backup
        options: [provider-backup, logical-dump]

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    name: Restore into isolated target and verify
    runs-on: ubuntu-latest
    environment: recovery-drill
    timeout-minutes: 120
    env:
      RESTORE_BACKUP_SOURCE: ${{ inputs.backup_source }}
      RESTORE_TARGET_ID: ${{ vars.RESTORE_TARGET_ID }}
      RESTORE_TARGET_DATABASE_URL: ${{ secrets.RESTORE_TARGET_DATABASE_URL }}
      RESTORE_SOURCE_DATABASE_URL: ${{ secrets.RESTORE_SOURCE_DATABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RELEASE_SHA: ${{ github.sha }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESTORE_TIMING_FILE: .restore-drill/timing.json
      RESTORE_BACKUP_METADATA_FILE: .restore-drill/backup-metadata.json
      RESTORE_EVIDENCE_FILE: .restore-drill/restore-drill-evidence.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_restore --version

      - name: Restore drill preflight (target is not production; credentials by name only)
        env:
          RESTORE_BACKUP_DOWNLOAD_URL: ${{ secrets.RESTORE_BACKUP_DOWNLOAD_URL }}
        run: |
          mkdir -p .restore-drill
          node scripts/restore-drill.mjs preflight
          echo "{\"drillStartedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .restore-drill/start.json

      - name: Read provider backup metadata
        if: ${{ inputs.backup_source == 'provider-backup' }}
        run: node scripts/restore-drill.mjs list-backups

      - name: Acquire provider backup
        if: ${{ inputs.backup_source == 'provider-backup' }}
        env:
          RESTORE_BACKUP_DOWNLOAD_URL: ${{ secrets.RESTORE_BACKUP_DOWNLOAD_URL }}
        run: |
          curl -fsSL --retry 3 --max-time 1800 -o .restore-drill/backup.dump "$RESTORE_BACKUP_DOWNLOAD_URL"
          test -s .restore-drill/backup.dump || { echo "::error::downloaded backup is empty"; exit 1; }
          echo "backup bytes: $(stat -c %s .restore-drill/backup.dump)"

      - name: Take logical dump of production (read credential)
        if: ${{ inputs.backup_source == 'logical-dump' }}
        run: |
          DUMP_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          pg_dump --format=custom --no-owner --no-privileges --file=.restore-drill/backup.dump "$RESTORE_SOURCE_DATABASE_URL"
          test -s .restore-drill/backup.dump || { echo "::error::logical dump is empty"; exit 1; }
          node -e "require('fs').writeFileSync(process.env.RESTORE_BACKUP_METADATA_FILE, JSON.stringify({ sourceBackupId: 'logical-dump-' + process.env.WORKFLOW_RUN_ID, sourceBackupCreatedAt: process.argv[1], pitrEnabled: null, physicalBackupsEnabled: null }, null, 2))" "$DUMP_STARTED"

      - name: Restore into isolated target
        run: |
          set -o pipefail
          node scripts/restore-drill.mjs preflight
          # Application roles referenced by the schema must exist on the scratch
          # target; they are created NOLOGIN so the scratch copy is unreachable by
          # any Worker credential.
          psql -v ON_ERROR_STOP=1 "$RESTORE_TARGET_DATABASE_URL" -c "DO \$\$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='yourrank_app') THEN CREATE ROLE yourrank_app NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='yourrank_worker') THEN CREATE ROLE yourrank_worker NOLOGIN NOSUPERUSER NOBYPASSRLS INHERIT IN ROLE yourrank_app; END IF;
          END \$\$;"
          set +e
          if pg_restore --list .restore-drill/backup.dump >/dev/null 2>&1; then
            pg_restore --no-owner --no-privileges --clean --if-exists --exit-on-error \
              --dbname="$RESTORE_TARGET_DATABASE_URL" .restore-drill/backup.dump
          else
            ( gzip -t .restore-drill/backup.dump 2>/dev/null && gunzip -c .restore-drill/backup.dump || cat .restore-drill/backup.dump ) \
              | psql -v ON_ERROR_STOP=1 --quiet "$RESTORE_TARGET_DATABASE_URL" >/dev/null
          fi
          RESTORE_EXIT=$?
          set -e
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('.restore-drill/start.json','utf8'));fs.writeFileSync(process.env.RESTORE_TIMING_FILE, JSON.stringify({ drillStartedAt: s.drillStartedAt, restoreCompletedAt: new Date().toISOString(), restoreExitCode: Number(process.argv[1]) }, null, 2))" "$RESTORE_EXIT"
          [ "$RESTORE_EXIT" = "0" ] || { echo "::error::restore exited with $RESTORE_EXIT; the drill FAILED and no verification may be recorded"; exit 1; }

      - name: Integrity and application read checks, RTO/RPO evidence
        id: verify
        run: node scripts/restore-drill.mjs verify

      - name: Retire scratch copy of production data
        if: ${{ always() }}
        run: node scripts/restore-drill.mjs retire

      - name: Validate evidence document (complete, successful, retired, secret-free)
        run: |
          node scripts/restore-drill.mjs evidence-check
          {
            echo "## Restore drill evidence (run ${{ github.run_id }})"
            echo
            echo '```json'
            cat "$RESTORE_EVIDENCE_FILE"
            echo '```'
            echo
            echo "Record it as an admin with fresh step-up 2FA: POST /api/admin/backup-verifications (see docs/backup-restore-plan.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: restore-drill-evidence-${{ github.run_id }}
          path: |
            .restore-drill/restore-drill-evidence.json
            .restore-drill/timing.json
            .restore-drill/backup-metadata.json
          if-no-files-found: warn
          retention-days: 400
