# Production DLQ Inspect — READ-ONLY. A single authenticated GET against the
# bot's /bot/api/dlq endpoint; it never replays, deletes, or updates any row,
# and the report only contains grouped JSON types, key names, counts, and Zod
# code/path diagnostics — no message ids, bodies, error text, or secrets.
# Shares the `production-mutation` lock with deploy.yml/rollback.yml so a
# read never overlaps a production mutation.

name: Production DLQ Inspect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-mutation
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect production DLQ rows (sanitized)
    runs-on: ubuntu-latest
    environment: production
    env:
      PRODUCTION_APEX: https://yourrank.site
    steps:
      - name: Require production admin key
        env:
          PRODUCTION_ADMIN_API_KEY: ${{ secrets.PRODUCTION_ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_ADMIN_API_KEY:-}" ]; then
            echo "::error::PRODUCTION_ADMIN_API_KEY is not configured in the production environment"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/shared build
      - name: Fetch actionable DLQ rows
        env:
          PRODUCTION_ADMIN_API_KEY: ${{ secrets.PRODUCTION_ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          STATUS=$(curl -sS --max-time 60 -w '%{http_code}' \
            -H "x-api-key: $PRODUCTION_ADMIN_API_KEY" \
            "$PRODUCTION_APEX/bot/api/dlq?limit=200&include_body=true" \
            -o "$RUNNER_TEMP/dlq.json" || true)
          if [ "$STATUS" != "200" ]; then
            echo "::error::DLQ inspect request failed with HTTP $STATUS"
            exit 1
          fi
      - name: Sanitize + report
        run: |
          set -euo pipefail
          OUT=$(node scripts/production-dlq-inspect-sanitize.mjs "$RUNNER_TEMP/dlq.json")
          printf '%s\n' "$OUT"
          {
            echo "## Production DLQ inspect (sanitized)"
            echo '```json'
            printf '%s\n' "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
