# F-009: the ONLY path that may apply a CONTRACT-phase migration to production.
# deploy.yml rejects contract migrations; this workflow is manual, holds the
# shared production-mutation lock, and refuses to run unless every production
# Worker already serves the release the migration declares it requires at 100%
# (so no N-1 version is still reading the schema being contracted), the
# migration is the only pending file, and the operator has explicitly confirmed
# backfill, rollback-window closure and data validation.
name: Contract migration (manual)

on:
  workflow_dispatch:
    inputs:
      migration:
        description: "Contract migration file name (YYYYMMDDHHMMSS_description.sql)"
        required: true
        type: string
      backfill_complete:
        description: "Backfill for the expand phase has completed in production"
        required: true
        type: boolean
        default: false
      rollback_window_closed:
        description: "The previous release is retired; rollback to N-1 is intentionally no longer supported"
        required: true
        type: boolean
        default: false
      data_validation_passed:
        description: "Production data validation for this contract change passed"
        required: true
        type: boolean
        default: false
      confirm:
        description: "Type: CONTRACT <migration file name>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-mutation
  cancel-in-progress: false

jobs:
  contract-gate:
    name: Verify contract preconditions against production
    runs-on: ubuntu-latest
    environment: production
    outputs:
      state: ${{ steps.capture.outputs.state }}
    steps:
      - uses: actions/checkout@v7
      - name: Capture production Worker versions and applied migrations
        id: capture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: lygcqzjxlqbvymkfjvel
        run: node scripts/release-recovery-state.mjs capture
      - name: Refuse unless the rollback/N-1 window is provably closed
        env:
          RELEASE_STATE: ${{ steps.capture.outputs.state }}
          CONTRACT_MIGRATION: ${{ inputs.migration }}
          CONFIRM_BACKFILL_COMPLETE: ${{ inputs.backfill_complete }}
          CONFIRM_ROLLBACK_WINDOW_CLOSED: ${{ inputs.rollback_window_closed }}
          CONFIRM_DATA_VALIDATION_PASSED: ${{ inputs.data_validation_passed }}
          CONFIRM_PHRASE: ${{ inputs.confirm }}
        run: node scripts/check-migration-compatibility.mjs contract-gate

  apply-contract:
    name: Apply contract migration
    needs: contract-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.39.2
      - name: Apply the single pending contract migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -e
          supabase link --project-ref lygcqzjxlqbvymkfjvel --password "$SUPABASE_DB_PASSWORD"
          supabase db push --include-all
      - name: Next step for the operator
        run: |
          {
            echo "## Contract migration applied: ${{ inputs.migration }}"
            echo
            echo "Advance \`supabase/migration-policy.json\` (appliedThrough/historicalCount/historicalSha256) in a follow-up PR;"
            echo "\`deploy.yml\` refuses further production releases until the applied contract migration is inside the immutable baseline."
          } >> "$GITHUB_STEP_SUMMARY"
