# Local-only, disposable database for YR-002 fixtures. It is intentionally
# separate from the repository's normal `docker-compose.yml` database.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yourrank_yr002_fixtures
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yourrank_yr002_fixtures"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - yr002_postgres:/var/lib/postgresql/data
      # The runner uses this read-only mount to apply repository migrations and
      # the fixture SQL; no host database URL is accepted.
      - ${YR002_REPOSITORY_ROOT:?YR002_REPOSITORY_ROOT must be set by run.sh}:/workspace:ro

volumes:
  yr002_postgres:
