name = "yourrank-monitor"
main = "src/worker.ts"
compatibility_date = "2025-07-01"

# Cron trigger: every 5 minutes
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[triggers]
crons = ["*/5 * * * *"]

# Production environment variables (non-secret)
[vars]
MONITOR_TARGET = "https://yourrank.site"
MONITOR_SLUG = ""        # set to a known board slug after first board exists

# Secrets (set via wrangler secret put):
#   DISCORD_MONITORING_WEBHOOK — Discord webhook for uptime alerts
#   MONITOR_PB_KEY — known postback key for /pb canary check
#
# Vars:
#   MONITOR_BACKUP_CHECK = "true"  — also check /api/health/backup freshness

[env.staging]
name = "yourrank-monitor-staging"

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# Staging schedules are intentionally disabled; the staging release triggers the
# protected /check endpoint deterministically instead.
[env.staging.triggers]
crons = []

[env.staging.vars]
MONITOR_TARGET = "https://staging.yourrank.site"
MONITOR_SLUG = ""
MONITOR_BACKUP_CHECK = "true"
