name = "yourrank-monitor"
main = "src/worker.ts"
compatibility_date = "2025-07-01"

# Cron trigger: every 5 minutes
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[triggers]
crons = ["*/5 * * * *"]

# Production environment variables (non-secret). The contract below is enforced
# by `node scripts/monitor-preflight.mjs production` before any production
# mutation and again against the deployed Worker's secret names.
[vars]
MONITOR_TARGET = "https://yourrank.site"
MONITOR_SLUG = ""        # set to a known board slug after first board exists
# Backup-freshness monitoring is mandatory for production: the monitor fails the
# "GET /api/health/backup" check until a valid successful restore drill is
# recorded (launch prerequisite, see docs/recovery.md).
MONITOR_BACKUP_CHECK = "true"

# Secrets (set via wrangler secret put / the release workflow):
#   MONITOR_CHECK_SECRET — REQUIRED; /check is disabled (503) without it and only
#                          accepts `Authorization: Bearer <secret>`
#   DISCORD_MONITORING_WEBHOOK — alert path (at least one alert path is required)
#   RESEND_API_KEY + ALERT_EMAIL — email alert path
#   MONITOR_PB_KEY — known postback key for /pb canary check

[env.staging]
name = "yourrank-monitor-staging"

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# Staging schedules are intentionally disabled; the staging release triggers the
# protected /check endpoint deterministically instead.
[env.staging.triggers]
crons = []

[env.staging.vars]
MONITOR_TARGET = "https://staging.yourrank.site"
MONITOR_SLUG = ""
MONITOR_BACKUP_CHECK = "true"
