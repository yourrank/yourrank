name = "yourrank-web"
main = ".open-next/worker.js"
compatibility_date = "2026-08-16"
compatibility_flags = ["nodejs_compat"]

# Primary app domain for the Next.js marketing homepage.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[[routes]]
pattern = "app.yourrank.site"
custom_domain = true

# Legacy host retained solely so middleware can redirect it to the apex.
[[routes]]
pattern = "next.yourrank.site"
custom_domain = true

# Run the worker before serving static assets so middleware executes.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = true

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "9e5b625bfdd84cd691b44c4780bdaf13"
# Local dev fallback (override with CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE)
localConnectionString = "postgresql://postgres:postgres@localhost:5432/yourrank"

# Staging is a service-binding target for the apex staging Worker. It has no
# public custom-domain route of its own.
[env.staging]
name = "yourrank-web-staging"

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[env.staging.assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = true

# Replace before the first staging deploy; staging must never share production DB access.
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "STAGING_HYPERDRIVE_ID_PLACEHOLDER"
