name = "yourrank-bot"
main = "src/worker.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
# Dashboard APIs and webhook handlers perform sequential Hyperdrive reads.
# Smart Placement reduces the repeated EU-origin round trips for those paths.
placement = { mode = "smart" }

# Serve the bot Worker under the /bot, /hook, /r, /pb, /billing and
# /dashboard/telegram prefixes on the main zone. More-specific routes win, so
# the leaderboard Worker keeps the root.
# Keep this list above every table header: in TOML a top-level key written after
# one belongs to that table, so Wrangler would read no zone routes at all and
# deploy the Worker with only its workers.dev hostname.
routes = [
  { pattern = "yourrank.site/bot",                 zone_name = "yourrank.site" },
  { pattern = "yourrank.site/bot/*",               zone_name = "yourrank.site" },
  { pattern = "yourrank.site/dashboard/telegram*", zone_name = "yourrank.site" },
  { pattern = "yourrank.site/hook/*",              zone_name = "yourrank.site" },
  { pattern = "yourrank.site/billing/hook/*",      zone_name = "yourrank.site" },
  { pattern = "yourrank.site/r/*",                 zone_name = "yourrank.site" },
  { pattern = "yourrank.site/pb",                  zone_name = "yourrank.site" },
  { pattern = "yourrank.site/pb*",                 zone_name = "yourrank.site" },
  { pattern = "yourrank.site/pb/*",                zone_name = "yourrank.site" },
]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[vars]
PUBLIC_BASE_URL = "https://yourrank.site"
RL_BACKEND = "do"  # Change to "kv" to use KV for rate limiting
RL_FAIL_OPEN = "false"  # Block requests when the rate-limit backend is down (fail-closed).
POSTBACK_UNSIGNED_ENABLED = "false"  # Signed postbacks only.
SESSION_COOKIE_DOMAIN = ".yourrank.site"
# Set SENTRY_DSN via `wrangler secret put SENTRY_DSN` when ready

[[queues.producers]]
queue = "yourrank-events"
binding = "EVENTS_QUEUE"

[triggers]
# every minute: broadcast batches | every five minutes: webhook recovery
# | 03:00 UTC: rollup + partitions + expired plans
crons = ["* * * * *", "*/5 * * * *", "0 3 * * *"]


# --- Durable Object for rate limiting ---
# RateLimiter predates migration stanzas and is already live on this script;
# no migration is needed because this Worker introduces no new DO class.
[[durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "RateLimiter"

# Postgres via Hyperdrive — recreated with correct username (postgres).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "9e5b625bfdd84cd691b44c4780bdaf13"

# Secrets (wrangler secret put ...):
#   DATABASE_URL            # Supabase connection string (only if not using Hyperdrive)
#   TOKEN_ENC_KEY           # 32-byte hex, encrypts streamer bot tokens
#   ADMIN_API_KEY           # protects /bot/api/*
#   IP_HASH_SALT            # salts hashed visitor IPs
#   LOGIN_BOT_TOKEN         # @BotFather token for the Telegram Login widget (/bot dashboard)
#   LOGIN_BOT_USERNAME      # the login bot's @username (the widget needs it)
#   RESEND_API_KEY          # transactional email for onboarding sequence
#   MAIL_FROM               # From: address for Resend, e.g. "YourRank <hey@yourrank.site>"

# ---------------------------------------------------------------------------
# Staging environment (wrangler deploy --env staging)
# ---------------------------------------------------------------------------
[env.staging]
name = "yourrank-bot-staging"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "staging.yourrank.site/bot",           zone_name = "yourrank.site" },
  { pattern = "staging.yourrank.site/bot/*",         zone_name = "yourrank.site" },
  { pattern = "staging.yourrank.site/dashboard/telegram*", zone_name = "yourrank.site" },
  { pattern = "staging.yourrank.site/hook/*",        zone_name = "yourrank.site" },
  { pattern = "staging.yourrank.site/billing/hook/*", zone_name = "yourrank.site" },
  { pattern = "staging.yourrank.site/r/*",           zone_name = "yourrank.site" },
  { pattern = "staging.yourrank.site/pb",            zone_name = "yourrank.site" },
  { pattern = "staging.yourrank.site/pb/*",          zone_name = "yourrank.site" },
]

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[env.staging.triggers]
crons = ["* * * * *", "*/5 * * * *", "0 3 * * *"]

[env.staging.vars]
PUBLIC_BASE_URL = "https://staging.yourrank.site"
RL_BACKEND = "do"
RL_FAIL_OPEN = "false"
POSTBACK_UNSIGNED_ENABLED = "false"
SESSION_COOKIE_DOMAIN = ".staging.yourrank.site"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[env.staging.queues.producers]]
queue = "yourrank-events-staging"
binding = "EVENTS_QUEUE"

[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "RateLimiter"


# Staging Hyperdrive — points to a dedicated staging Supabase DB.
# TODO: Replace placeholder with actual staging Hyperdrive ID before flipping staging infra.
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "STAGING_HYPERDRIVE_ID_PLACEHOLDER"
