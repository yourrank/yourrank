name = "yourrank-site"
# Build first: `node build.js` regenerates src/assets_bundled.js from the files
# in src/assets/ (inlined as strings). Wrangler bundles from src/index.js and
# follows its imports (including the 'postgres' driver).
main = "src/index.js"
compatibility_date = "2025-07-01"
# postgres.js needs the Node compat shim (process, Buffer, etc.) on Workers.
# v1 (nodejs_compat) works; if you hit module-polyfill issues on deploy, bump
# to nodejs_compat_v2 and a newer compatibility_date per Cloudflare's guidance.
compatibility_flags = ["nodejs_compat"]
# Dashboard and public routes perform several sequential Hyperdrive reads.
# Smart Placement keeps this request path near the Supabase origin.
placement = { mode = "smart" }

# This Worker owns the ROOT of the zone. The bot Worker claims the more-specific
# /bot/*, /hook/*, /r/*, /pb/* prefixes; more-specific wins, so
# everything else (/, /login, /signup, /dashboard, /<slug>, /go/<slug>) lands here.
routes = [
  { pattern = "yourrank.site/*", zone_name = "yourrank.site" },
]


# --- Durable Objects ---
# Set RL_BACKEND=do to use DO instead of KV for rate limiting.
# Keeps fail-open behavior if DO is unreachable.
# RateLimiter predates this stanza and is already live on this script, so it must
# not be declared as a new class: only LiveBoard is being introduced here.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveBoard"]

[[durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "LIVE_BOARD_DO"
class_name = "LiveBoard"

# --- Event queue producer ---
# Analytics (views, clicks, copies) and postback conversions are enqueued here
# for the consumer Worker to process durably off the request thread.
[[queues.producers]]
queue = "yourrank-events"
binding = "EVENTS_QUEUE"

# --- Postgres (Supabase) via Hyperdrive. ---
# Config recreated with correct username (postgres, not postgres.<ref>).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "9e5b625bfdd84cd691b44c4780bdaf13"

[triggers]
crons = ["*/5 * * * *"]

[vars]
APP_NAME = "YourRank"
ENVIRONMENT = "production"
CF_ZONE_ID = "dd79a3ac13643b94732f2fef6ce3b1f5"
RL_BACKEND = "do"  # Change to "kv" to use KV for rate limiting
RL_FAIL_OPEN = "false"  # Block requests when the rate-limit backend is down (fail-closed).
LIVE_BOARD_PUSH_ENABLED = "false"
LIVE_BOARD_STREAM_KILL_SWITCH = "false"
LIVE_BOARD_FALLBACK_POLL_MS = "60000"
LIVE_BOARD_MAX_SUBSCRIBERS = "1000"
DLQ_HEALTH_DEGRADE_THRESHOLD = "100"
DLQ_HEALTH_MAX_AGE_SECONDS = "86400"
REQUEST_METRICS = "true"  # Set false to disable per-request capacity telemetry.
POSTBACK_UNSIGNED_ENABLED = "false"  # Signed postbacks only.
# Production session cookie is scoped to the apex domain so it is shared across
# subdomains, but isolated from staging by the staging value below.
SESSION_COOKIE_DOMAIN = ".yourrank.site"
# Set ALLOW_DEMO_LOGIN = "true" to enable a one-click /auth/demo dashboard demo.
# In production this should be "false" unless you want a public demo account.
ALLOW_DEMO_LOGIN = "false"
DEMO_USER_EMAIL = "demo@yourrank.site"
# Optional Google Business Profile integration (/reviews page).
# GBP_REVIEW_URL = "https://g.page/.../review"
# GBP_PHOTO_URL = "https://yourrank.site/og.png"
# Set SENTRY_DSN via `wrangler secret put SENTRY_DSN` when ready

[[services]]
binding = "MARKETING"
service = "yourrank-web"

# --- Secrets (set via `wrangler secret put <NAME>`), NOT stored here: ---
#   DATABASE_URL            (fallback if Hyperdrive isn't bound)
#   NOWPAYMENTS_API_KEY
#   NOWPAYMENTS_IPN_SECRET
#   RESEND_API_KEY          (required in production; creator verification and recovery)
#   TOKEN_ENC_KEY           # 32-byte hex, encrypts TOTP secrets for admin 2FA
#   MAIL_FROM               (required if RESEND_API_KEY is set; the From: address,
#                            e.g. "YourRank <hey@yourrank.site>" — Resend rejects
#                            an empty From)
#   PRO_PRICE_USD           (optional; defaults to 29)
#   LEAD_WEBHOOK_URL        (optional; Discord/Slack ping on a new lead)
#   DISCORD_MONITORING_WEBHOOK (optional; error reporting + cron summaries)
#   BACKUP_VERIFICATION_LIMIT_HOURS (optional; defaults to 168 — 7 days)
#   KICK_WEBHOOK_PUBLIC_KEY (required for Kick channel-point credits integration)
#   KICK_CLIENT_ID          (required for Kick OAuth login)
#   KICK_CLIENT_SECRET      (required for Kick OAuth login)
#   KICK_REDIRECT_URI       (defaults to https://yourrank.site/auth/kick/callback)

# ---------------------------------------------------------------------------
# Staging environment (wrangler deploy --env staging)
# See STAGING.md for setup instructions.
# ---------------------------------------------------------------------------
[env.staging]
name = "yourrank-site-staging"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "staging.yourrank.site/*", zone_name = "yourrank.site" },
]

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# Staging schedules are intentionally disabled: cron side effects (rollups, notifications,
# backups) are exercised locally with `wrangler dev --env staging --test-scheduled`.
[env.staging.triggers]
crons = []

[env.staging.vars]
DLQ_HEALTH_DEGRADE_THRESHOLD = "100"
DLQ_HEALTH_MAX_AGE_SECONDS = "86400"
APP_NAME = "YourRank (Staging)"
ENVIRONMENT = "staging"
CF_ZONE_ID = "dd79a3ac13643b94732f2fef6ce3b1f5"
RL_BACKEND = "do"
RL_FAIL_OPEN = "false"
REQUEST_METRICS = "true"
ALLOW_DEMO_LOGIN = "false"
DEMO_USER_EMAIL = "demo@yourrank.site"
POSTBACK_UNSIGNED_ENABLED = "false"
LIVE_BOARD_PUSH_ENABLED = "false"
LIVE_BOARD_STREAM_KILL_SWITCH = "false"
LIVE_BOARD_FALLBACK_POLL_MS = "60000"
LIVE_BOARD_MAX_SUBSCRIBERS = "1000"
# Staging cookies must not be visible to the production apex domain.
SESSION_COOKIE_DOMAIN = ".staging.yourrank.site"
# RESEND_API_KEY and MAIL_FROM are required before staging creator signup is enabled.

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter", "LiveBoard"]


[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "RateLimiter"

[[env.staging.durable_objects.bindings]]
name = "LIVE_BOARD_DO"
class_name = "LiveBoard"

[[env.staging.queues.producers]]
queue = "yourrank-events-staging"
binding = "EVENTS_QUEUE"

[[env.staging.services]]
binding = "MARKETING"
service = "yourrank-web-staging"

# Staging Hyperdrive — points to a dedicated staging Supabase DB.
# TODO: Replace placeholder with actual staging Hyperdrive ID before flipping staging infra.
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "STAGING_HYPERDRIVE_ID_PLACEHOLDER"
